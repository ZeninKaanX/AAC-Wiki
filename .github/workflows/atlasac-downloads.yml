name: Publish AtlasAC PC downloads
on:
  push:
    branches: [main]
    paths:
      - downloads/SHA256SUMS.txt
      - .github/workflows/atlasac-downloads.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify supplied application archives
        working-directory: downloads
        run: |
          cat parts/AtlasAC-Linux-x64.zip.part* > AtlasAC-Linux-x64.zip
          sha256sum -c SHA256SUMS.txt
          unzip -t AtlasAC-Windows.zip
          unzip -t AtlasAC-Linux-x64.zip
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create atlasac-pc-20261117 downloads/AtlasAC-Windows.zip downloads/AtlasAC-Linux-x64.zip downloads/SHA256SUMS.txt --title "AtlasAC PC — 17.11.2026" --notes "Windows ve Linux x64 uygulamaları. ZIP dosyasını çıkarıp işletim sisteminize uygun AtlasAC dosyasını açın. Bir eşleşme tek başına hile kullanımı kanıtı değildir; AAC tarafından değerlendirilmelidir."
